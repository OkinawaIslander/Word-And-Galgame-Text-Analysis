[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textlens"
version = "0.2.0"
description = "Local-first full-text search and analysis for Word documents and galgame scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TextLens" }]
keywords = ["docx", "galgame", "full-text-search", "sqlite", "nlp"]
dependencies = []

[project.optional-dependencies]
zh = ["jieba>=0.42"]
dev = ["pytest>=8"]

[project.scripts]
textlens = "textlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
